# Release of Taoist for direct download: runs only on a release tag, made by the VS Code task "Release: Tag Taoist"
# (GuiGuBaHuang-ModLib/scripts/release/create-release-tag.ps1, version read from the source code):
#   Taoist-<ver>  -> Taoist-<ver>.zip
# ModLib is released by its own repository (GuiGuBaHuang-ModLib, tags ModLib-<ver>).
# The zip is the folder 3161035078/debug/Mod_nE7UL2 (package-release.ps1). The CI cannot build (no game DLLs):
# the DLLs of debug/ are the committed ones, ModConf/ModImg/SteamImg are copied by build-project.ps1 -ResourcesOnly.
# Then a GitHub Release, and a new file version on Nexus Mods when set up (VS Code task "Setup: Nexus Mods (CI)",
# GuiGuBaHuang-ModLib/scripts/setup/setup-nexus.ps1).
name: Release

on:
  push:
    tags:
      - "Taoist-*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true          # SteamImg pictures (Git LFS) are part of debug/<mod>
          submodules: true   # shared scripts of GuiGuBaHuang-ModLib (release, build-project)

      - name: Zip debug/<mod>
        id: pkg
        shell: pwsh
        env:
          NEXUS_TAOIST_URL: ${{ vars.NEXUS_TAOIST_URL }}
        run: ./GuiGuBaHuang-ModLib/scripts/release/package-release.ps1 -Tag "${{ github.ref_name }}" -RepoRoot . -PrepareResources -OutDir dist -GitHubOutput

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.pkg.outputs.title }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --verify-tag --title "$TITLE" --notes-file dist/release-notes.md
          fi

      - name: Nexus Mods - Taoist
        if: steps.pkg.outputs.taoist_zip != '' && vars.NEXUS_TAOIST_FILE_ID != ''
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUS_TAOIST_FILE_ID }}
          filename: dist/${{ steps.pkg.outputs.taoist_zip }}
          version: ${{ steps.pkg.outputs.taoist_version }}
          display_name: Taoist ${{ steps.pkg.outputs.taoist_version }}
          description: "Taoist ${{ steps.pkg.outputs.taoist_version }} (needs ModLib): ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          archive_existing_version: "true"
          update_mod_version: "true"
